name: Build DOWNFORCE Android App (APK)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "capacitor.config.json"
      - "public/offline.html"
      - "public/app-icon.webp"
      - "public/aero-d-fg.webp"
      - "public/mono-splash.webp"
      - ".github/scripts/customize_android.py"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Sign DOWNFORCE-v4.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize Capacitor Android Native Shell
        run: |
          mkdir -p /tmp/downforce-cap/public
          cp capacitor.config.json /tmp/downforce-cap/capacitor.config.json
          cp public/offline.html /tmp/downforce-cap/public/offline.html
          printf '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://downforce.lovable.app"></head><body style="background:#07080C;color:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;margin:0">Launching DOWNFORCE...</body></html>' > /tmp/downforce-cap/public/index.html
          cd /tmp/downforce-cap
          npm init -y
          npm install \
            @capacitor/core@^6.2.0 \
            @capacitor/cli@^6.2.0 \
            @capacitor/android@^6.2.0 \
            @capacitor/app@^6.0.2 \
            @capacitor/haptics@^6.0.2 \
            @capacitor/local-notifications@^6.1.2 \
            @capacitor/share@^6.0.2 \
            @capacitor/filesystem@^6.0.2 \
            @capacitor/splash-screen@^6.0.2 \
            @capacitor/status-bar@^6.0.2
          npx cap add android
          npx cap sync android

      - name: Generate F1 Carbon/Crimson Icons, Splash Screen, App Shortcuts & Native Polish
        run: |
          python3 -m pip install --quiet pillow
          python3 "$GITHUB_WORKSPACE/.github/scripts/customize_android.py" /tmp/downforce-cap/android/app/src/main

      - name: Sign & Compile Release APK
        run: |
          echo "" | base64 -d > /tmp/downforce-cap/android/app/downforce-release.keystore
          cat << 'GRADLEEOF' >> /tmp/downforce-cap/android/app/build.gradle

          android {
              signingConfigs {
                  release {
                      storeFile file("downforce-release.keystore")
                      storePassword "downforce2026"
                      keyAlias "downforce"
                      keyPassword "downforce2026"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled false
                  }
              }
          }
          GRADLEEOF
          cd /tmp/downforce-cap/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DOWNFORCE-v4.apk"
          ls -lh "$GITHUB_WORKSPACE/DOWNFORCE-v4.apk"

      - name: Upload DOWNFORCE-v4.apk to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DOWNFORCE-Android-APK
          path: DOWNFORCE-v4.apk
          retention-days: 90

      - name: Publish DOWNFORCE-v4.apk to Live GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest DOWNFORCE-v4.apk \
            --title "DOWNFORCE Official Android App (2026 Season)" \
            --notes "🏎️ **DOWNFORCE Official Android App (.APK)** — Includes F1 Telemetry Haptics, Offline Race Alarms, Native Card Sharing, App Icon Shortcuts, and Zero-Flicker Carbon Launch." \
            --latest
