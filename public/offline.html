<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>RED FLAG — Session Suspended · DOWNFORCE</title>
  <style>
    :root {
      --bg: #07080c;
      --panel: rgba(18, 21, 31, 0.88);
      --red: #e10600;
      --gold: #ffd230;
      --text: #f8fafc;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100svh;
      background-color: var(--bg);
      background-image:
        radial-gradient(circle at 80% 12%, rgba(225, 6, 0, 0.22), transparent 55%),
        radial-gradient(circle at 20% 88%, rgba(255, 210, 48, 0.12), transparent 55%);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--panel);
      border: 1px solid rgba(225, 6, 0, 0.45);
      border-top: 5px solid var(--red);
      border-radius: 18px;
      padding: 32px 24px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.75), 0 0 32px rgba(225, 6, 0, 0.18);
      backdrop-filter: blur(16px);
    }
    .lights {
      display: inline-flex;
      gap: 10px;
      background: #0b0d14;
      padding: 10px 18px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }
    .light {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--red);
      box-shadow: 0 0 14px var(--red);
      animation: pulse 1.1s infinite alternate;
    }
    @keyframes pulse {
      0% { opacity: 0.35; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1.05); }
    }
    .flag-tag {
      display: inline-block;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--gold);
      background: rgba(255, 210, 48, 0.12);
      border: 1px solid rgba(255, 210, 48, 0.35);
      padding: 5px 12px;
      border-radius: 999px;
      margin-bottom: 12px;
    }
    h1 {
      font-size: 28px;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.1;
    }
    p {
      margin-top: 12px;
      font-size: 14px;
      line-height: 1.55;
      color: var(--muted);
    }
    .btn {
      margin-top: 24px;
      width: 100%;
      background: var(--red);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      padding: 14px 20px;
      font-family: ui-monospace, monospace;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 0 24px rgba(225, 6, 0, 0.4);
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status {
      margin-top: 14px;
      font-family: ui-monospace, monospace;
      font-size: 11px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="lights">
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
      <span class="light"></span>
    </div>
    <div><span class="flag-tag">🚩 Red Flag · Session Suspended</span></div>
    <h1>Telemetry Offline</h1>
    <p>
      Pit wall radio lost connection to the track server. Check your Wi-Fi or mobile data to rejoin the Paddock and lock in your picks.
    </p>
    <button class="btn" onclick="rejoinTrack()">Rejoin the Paddock 🏁</button>
    <div class="status" id="statusText">Waiting for network signal…</div>
  </div>
  <script>
    const TARGET_URL = "https://downforce.lovable.app";
    function rejoinTrack() {
      const el = document.getElementById("statusText");
      if (el) el.textContent = "Reconnecting to Pit Wall telemetry…";
      if (navigator.vibrate) navigator.vibrate(15);
      window.location.replace(TARGET_URL);
    }
    window.addEventListener("online", () => {
      rejoinTrack();
    });
  </script>
</body>
</html>
